<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ASHS 115義</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    background: #000;
    color: #0f0;
    font-family: 'Orbitron', monospace, monospace;
    overflow: hidden;
  }

  .screen {
    position: relative;
    width: 100vw;
    height: 100vh;
    padding: 20px;
    box-sizing: border-box;
    display: none;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-gap: 20px;
    height: 100%;
  }

  .camera-feed {
    position: relative;
    overflow: hidden;
  }

  .camera-feed video,
  .camera-feed img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: drop-shadow(0 0 5px #5bc0de);
  }

  .embedded-panel {
    margin-top: 16px;
    border: 1px solid #5bc0de;
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 0 12px rgba(91, 192, 222, 0.35);
    background: rgba(0, 24, 34, 0.5);
  }

  .embedded-panel iframe {
    width: 100%;
    height: 320px;
    border: 0;
    border-radius: 8px;
    background: #02141d;
  }

  @keyframes pulse {
    0%, 100% {
      box-shadow: 0 0 15px #ff0000;
    }
    50% {
      box-shadow: 0 0 30px #ff0000;
    }
  }

  /* 科技文字閃爍 */
  .tech-text {
    font-size: 14px;
    letter-spacing: 0.15em;
    color: #0f0;
    text-shadow: 0 0 8px #0f0;
    animation: flicker 1.5s infinite alternate;
  }
  .tech-text.no-flicker {
    animation: none !important;
  }

  /* 藝文類圖片樣式，橢圓放大且無邊框背景 */
  .camera-feed > div.tech-text[style*="藝文類"] + a > img {
    border-radius: 40% / 60%; /* 橢圓形比例，寬度偏大 */
    border: none; /* 移除藍色邊框 */
    padding: 0; /* 移除內距 */
    background: transparent; /* 移除背景色 */
    width: 120%; /* 放大圖片寬度 */
    height: auto;
    display: block;
    margin: 0 auto;
  }

  @keyframes flicker {
    from { opacity: 1; }
    to { opacity: 0.5; }
  }
.checkmark-screen {
  position: fixed;
  z-index: 1000;
  background: black;
  width: 100%;
  height: 100%;
  color: #5bc0de;
  display: none;
  align-items: center;
  justify-content: center;
  font-family: 'Orbitron', monospace;
  flex-direction: column;
}

.checkmark-container {
  perspective: 600px;
}

.checkmark {
  width: 100px;
  height: 100px;
  stroke: url(#laserGradient);
  stroke-width: 5;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  border-radius: 50%;
  background-color: black;
  overflow: hidden;
  /* animation: scaleIn 0.5s ease-out forwards; */
  /* 強化發光效果 */
}

.checkmark-circle {
  stroke: #5bc0de;
  stroke-dasharray: 166;
  stroke-dashoffset: 0;
  animation: rotateCircle 2s linear infinite;
}

@keyframes rotateCircle {
  0% {
    transform: rotate(0deg);
    transform-origin: center;
  }
  100% {
    transform: rotate(360deg);
    transform-origin: center;
  }
}

.checkmark-check {
  stroke-dasharray: 48;
  stroke-dashoffset: 48;
  animation: laserStroke 1.2s ease-in-out forwards;
  /* 白色高光陰影強調邊緣 */
}

@keyframes strokeArc {
  to {
    stroke-dashoffset: 66;
  }
}

@keyframes laserStroke {
  0% {
    stroke-dashoffset: 48;
    opacity: 0.5;
  }
  50% {
    opacity: 1;
  }
  100% {
    stroke-dashoffset: 0;
    opacity: 0.2;
  }
}

/*@keyframes scaleIn {
  from {
    transform: scale(0.6);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}*/

.checkmark-text {
  margin-top: 20px;
  font-size: 24px;
  color: #5bc0de;
  text-shadow: 0 0 8px #5bc0de;
  animation: fadeIn 1s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.intro-screen {
  position: fixed;
  z-index: 999;
  background: black;
  width: 100%;
  height: 100%;
  color: #5bc0de;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Orbitron', monospace;
  animation: intro-fade 2s ease-in-out;
}

.intro-text {
  font-size: 40px;
  letter-spacing: 0.2em;
  text-align: center;
  margin-bottom: 30px;
  animation: flicker 2s infinite alternate;
  font-family: 'Pacifico', cursive;
}

#welcomeText {
  font-family: 'Pacifico', cursive;
}

@keyframes slideInFade {
  0% {
    opacity: 0;
    transform: translateY(20px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

#siteText {
  font-family: 'Pacifico', cursive;
  font-size: 32px;
}

#siteText.animate {
  animation: slideInFade 0.6s ease-out forwards;
}

  .slider-track {
    cursor: pointer;
    width: 220px;
    height: 40px;
    background: linear-gradient(90deg, rgba(91, 192, 222, 0.3), rgba(91, 192, 222, 0.15));
    border-radius: 20px;
    box-shadow: 0 0 15px rgba(91, 192, 222, 0.6) inset;
    padding: 0 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    user-select: none;
    transition: background 0.3s ease;
  }

  .slider-track:hover {
    background: linear-gradient(90deg, rgba(91, 192, 222, 0.5), rgba(91, 192, 222, 0.3));
  }

  .slider-thumb {
    width: 36px;
    height: 36px;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.2s ease;
    cursor: default; /* 圖片不單獨點擊 */
    border-radius: 0;
    background: transparent;
    border: none;
    box-shadow: none;
    filter: drop-shadow(0 0 5px #5bc0de);
  }

  .slider-thumb img {
    width: 70%;
    height: 70%;
    object-fit: contain;
    filter: drop-shadow(0 0 5px #5bc0de);
    pointer-events: none;
    user-select: none;
  }

  .slider-track:hover .slider-thumb {
    transform: scale(1.15);
    filter: drop-shadow(0 0 12px #5bc0de);
  }

  .slider-text {
    color: #5bc0de;
    font-family: 'Courier New', Courier, monospace;
    font-size: 16px;
    letter-spacing: 0.25em;
    font-weight: 700;
    text-transform: uppercase;
    text-shadow:
      0 0 5px #5bc0de,
      0 0 10px #5bc0de,
      0 0 20px #5bc0de,
      0 0 40px #5bc0de;
    user-select: none;
    margin: 0;
    white-space: nowrap;
    opacity: 0.85;
  }

  .marquee-container {
    position: relative;
    overflow: hidden;
    height: 30px;
    background: #001822;
    border: 2px solid #5bc0de;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(91, 192, 222, 0.6);
    color: #5bc0de;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    line-height: 30px;
    white-space: nowrap;
  }

  .marquee {
    display: inline-block;
    padding-left: 100%;
    animation: marqueeAnim 15s linear infinite;
  }

  @keyframes marqueeAnim {
    0% { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }

  #marqueeInput {
    width: 100%;
    margin-top: 10px;
    padding: 5px 10px;
    background: #001822;
    border: 2px solid #5bc0de;
    border-radius: 8px;
    color: #5bc0de;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    outline: none;
  }
</style>
</head>
<body>
  <div class="intro-screen" id="introScreen">
    <div class="intro-text" id="welcomeText">hello</div>
    <div class="intro-text" id="siteText" style="display:none;">
      ASHS 115 yi
      <div class="slider-box">
        <div class="slider-track">
          <div class="slider-thumb" id="unlockThumb" title="點擊解鎖">
            <img src="Touch ID Logo Illustration.webp" alt="Touch ID Logo" />
          </div>
          <div class="slider-text">Touch to Unlock</div>
        </div>
      </div>
    </div>
  </div>
  <div class="checkmark-screen" id="checkmarkScreen">
    <div class="checkmark-container">
      <svg class="checkmark" viewBox="0 0 52 52">
        <defs>
          <linearGradient id="laserGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#5bc0de" stop-opacity="0.2" />
            <stop offset="50%" stop-color="#5bc0de" stop-opacity="1" />
            <stop offset="100%" stop-color="#5bc0de" stop-opacity="0.2" />
          </linearGradient>
        </defs>
        <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none" />
        <path class="checkmark-check" fill="none" d="M14 27l7 7 16-16" />
      </svg>
    </div>
    <div class="checkmark-text">Success</div>
  </div>
  <div class="screen">
    <div class="tech-text">ASHS_115YI OPERATING SYSTEM</div>
    <div id="countdown" class="tech-text no-flicker"></div>
    <div class="grid">
      <div class="camera-feed">
        <div class="tech-text" style="color: #6bc0f7; text-shadow: 0 0 6px #6bc0f7; padding-left: 12px;">各科資料</div>
        <a href="https://drive.google.com/drive/folders/15O1etUzfVCB6r2ynGiy353ZItaZ_zP19?usp=sharing" target="_blank" rel="noopener noreferrer">
          <img src="電子書.png" alt="各種資料" />
        </a>
        <div class="scan-line"></div>
      </div>
      <div class="camera-feed">
        <div class="tech-text" style="color: #6bc0f7; text-shadow: 0 0 6px #6bc0f7; padding-left: 12px;">網頁更新日記</div>
        <a href="https://eugeneliu888.github.io/update-note-high-Quality/" target="_blank" rel="noopener noreferrer">
          <img src="網頁更新Ai.png" alt="網頁更新日記" />
        </a>
        <div class="scan-line"></div>
      </div>
      <div class="camera-feed">
        <div class="tech-text" style="color: #6bc0f7; text-shadow: 0 0 6px #6bc0f7;">考試時間</div>
        <a href="https://ashs115yitestschedule.notion.site/2d849e9eec318058a909fe4720e6d218?v=2d849e9eec3181c7b682000c651a19fd&pvs=74" target="_blank" rel="noopener noreferrer">
          <img src="小豹紋Ai.png" alt="考試時間" />
        </a>
        <div class="scan-line"></div>
      </div>
      <div class="camera-feed">
        <div class="tech-text" style="color: #6bc0f7; text-shadow: 0 0 6px #6bc0f7;">藝文類</div>
        <a href="https://eugeneliu888.github.io/Yi-/" target="_blank" rel="noopener noreferrer">
          <img src="Mission Impossible Entity Logo.jpg" alt="藝文類圖片" />
        </a>
        <div class="scan-line"></div>
      </div>
    </div> <!-- .grid 結束 -->

    <div class="embedded-panel">
      <div class="tech-text no-flicker" style="margin-bottom: 10px;">考試行程（Notion 內嵌預覽）</div>
      <iframe src="https://ashs115yitestschedule.notion.site/ebd//2d849e9eec318058a909fe4720e6d218?v=2d849e9eec3181c7b682000c651a19fd" allowfullscreen></iframe>
    </div>

  </div> <!-- .screen 結束 -->

  <!-- 藝文四格畫面 -->
  <div class="screen art-screen" style="display:none;">
    <div class="grid">
      <div class="camera-feed">
        <div class="tech-text">108 記憶中的風</div>
        <img src="art1.jpg" alt="108 記憶中的風" />
      </div>
      <div class="camera-feed">
        <div class="tech-text">108 驚險的旅程</div>
        <img src="art2.jpg" alt="108 驚險的旅程" />
      </div>
      <div class="camera-feed">
        <div class="tech-text">109 十年的流星</div>
        <img src="art3.jpg" alt="109 十年的流星" />
      </div>
      <div class="camera-feed">
        <div class="tech-text">109 泡泡</div>
        <img src="art4.jpg" alt="109 泡泡" />
      </div>
    </div>
  </div>
  <audio id="unlockAudio" src="Apple Intelligence Sound.mp3" preload="auto"></audio>
  <script>
    window.addEventListener('load', () => {
      // 取得今天日期
      const today = new Date();

      // 設定會考日期（固定每年 5 月 16 日）
      let examDate = new Date(today.getFullYear(), 4, 16); // 月份從 0 開始，4 = 五月

      // 如果今天已經過了今年的會考，就取明年的
      if (today > examDate) {
        examDate = new Date(today.getFullYear() + 1, 4, 16);
      }

      // 計算剩餘天數
      const diffTime = examDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      // 跳出小視窗顯示倒數
      alert("距離會考還有 " + diffDays + " 天！");
      // 同時顯示在畫面上
      const countdownEl = document.getElementById("countdown");
      if (countdownEl) {
        countdownEl.textContent = "距離會考還有 " + diffDays + " 天";
      }
    });
  </script>
</body>
<script>
  // 顯示 Hello 1.5 秒後切換至 ASHS 115 義官網
  setTimeout(() => {
    document.getElementById('welcomeText').style.display = 'none';
    const site = document.getElementById('siteText');
    site.style.display = 'block';
    site.classList.add('animate');
  }, 1500);

  function enterSystem() {
    const intro = document.getElementById('introScreen');
    const checkmark = document.getElementById('checkmarkScreen');

    try {
      const audio = document.getElementById('unlockAudio');
      audio.volume = 0.7; // 調大音量，避免太小聲
      audio.currentTime = 0; // 確保從頭播放
      audio.play().then(() => {
        console.log('音效播放成功');
      }).catch(e => {
        console.warn('音效播放失敗:', e);
      });
    } catch (e) {
      console.warn('音效播放失敗:', e);
    }

    intro.classList.add("slide-out");
    setTimeout(() => {
      intro.style.display = 'none';
      checkmark.style.display = 'flex';
    }, 600);

    setTimeout(() => {
      checkmark.style.display = 'none';
      document.querySelector(".screen").style.display = "block";
    }, 2000);
  }

  // 改為整個 slider-track 可點擊觸發
  document.querySelector('.slider-track').addEventListener('click', enterSystem);

  // Marquee input logic
  const marquee = document.getElementById('marquee');

  // 跑馬燈訊息自動抓取（Google Apps Script API）
  async function fetchMarquee() {
    try {
      const res = await fetch('https://script.google.com/macros/s/AKfycbz3FimJvX1FPCV62DilmxeKxhDhEwXcAUY5J-eY4X_ax5mJnLfGG6fWSvus4De9KsVz/exec');
      const data = await res.json();
      document.getElementById('marquee').textContent = data.message;
    } catch (e) {
      console.error('跑馬燈訊息讀取失敗', e);
    }
  }
  fetchMarquee();
  setInterval(fetchMarquee, 2000);

  // 自訂事件追蹤
  // 點擊「電子書」
  const ebookLink = document.querySelector('a[href*="drive.google.com"]');
  if (ebookLink) {
    ebookLink.addEventListener('click', () => {
      gtag('event', 'click_ebook', {
        event_category: 'link',
        event_label: '電子書'
      });
    });
  }

  // 點擊「藝文類」
  const artLink = document.querySelector('a[href*="Yi-"]');
  if (artLink) {
    artLink.addEventListener('click', () => {
      gtag('event', 'click_art', {
        event_category: 'link',
        event_label: '藝文類'
      });
    });
  }

  // 點擊「網頁更新日記」
  const updateLogLink = document.querySelector('a[href*="update-note"]');
  if (updateLogLink) {
    updateLogLink.addEventListener('click', () => {
      gtag('event', 'click_update_log', {
        event_category: 'link',
        event_label: '網頁更新日記'
      });
    });
  }

  // 點擊「考試時間」
  const examTimeLink = document.querySelector('a[href*="notion.site"]');
  if (examTimeLink) {
    examTimeLink.addEventListener('click', () => {
      gtag('event', 'click_exam_time', {
        event_category: 'link',
        event_label: '考試時間'
      });
    });
  }

  // 藝文類四格顯示
  function showArtScreen() {
    document.querySelectorAll(".screen").forEach(el => el.style.display = "none");
    document.querySelector(".art-screen").style.display = "block";
  }
</script>
</html>
